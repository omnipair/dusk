name: release-build

# Builds an immutable, unsigned bundle. Never deploys, signs, tags or publishes.
on:
  pull_request:
    paths:
      - "programs/**"
      - "packages/dusk-sdk/**"
      - "scripts/release/**"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-build.yaml"
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "packages/dusk-sdk/**"
      - "scripts/release/**"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-build.yaml"
  workflow_dispatch:
    inputs:
      commit:
        description: "Full reviewed commit SHA to build (no branch or tag)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANCHOR_VERSION: "0.31.1"
  SOLANA_VERSION: "4.1.0"
  SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate immutable source
        run: '[[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: mainnet-release-anchor-0.31.1-solana-4.1.0
      - name: Cache Solana CLI
        id: solana-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/solana/install
          key: solana-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SOLANA_VERSION }}
      - name: Install Solana
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "https://release.anza.xyz/v$SOLANA_VERSION/install" --output "$RUNNER_TEMP/solana-install.sh"
          sh "$RUNNER_TEMP/solana-install.sh"
      - name: Verify Solana CLI
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.local/share/solana/install/active_release/bin/solana" --version | cut -d ' ' -f 2)" = "$SOLANA_VERSION"
      - name: Cache Anchor CLI
        id: anchor-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.ANCHOR_VERSION }}
      - name: Install Anchor
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/coral-xyz/anchor --tag "v$ANCHOR_VERSION" anchor-cli --locked
      - name: Cache verifier
        id: verifier-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ runner.os }}-${{ runner.arch }}-0.4.11
      - name: Install verifier
        if: steps.verifier-cache.outputs.cache-hit != 'true'
        run: cargo install solana-verify --version 0.4.11 --locked
      - name: Verify build tools
        run: |
          test "$(anchor --version)" = "anchor-cli $ANCHOR_VERSION"
          test "$(solana-verify --version)" = "solana-verify 0.4.11"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check release tooling
        run: node --test scripts/release/release.test.mjs
      - name: Build smoke fixtures and interfaces
        run: yarn build:litesvm
      - name: Build both production programs reproducibly
        run: node scripts/release/build.mjs
      - name: Check build left the reviewed source unchanged
        run: git diff --exit-code
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@v4
        with:
          name: dusk-mainnet-release-${{ env.SOURCE_COMMIT }}
          path: target/mainnet-release/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload exact release binaries and smoke fixtures
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-release-litesvm-${{ env.SOURCE_COMMIT }}
          path: |
            target/deploy/*.so
            target/idl/*.json
          if-no-files-found: error
          retention-days: 7

  test-release-binaries:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mainnet-release-litesvm-${{ env.SOURCE_COMMIT }}
          path: target
      - name: Require ARM64 runner
        run: test "$(uname -m)" = "arm64"
      - name: Test the exact verifiable production binaries
        run: DUSK_EXPECT_PRODUCTION_MINT_SUFFIXES=1 DUSK_REQUIRE_COMPLETE_CU_BASELINE=1 yarn test-litesvm:no-build --forbid-pending
