name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ANCHOR_VERSION: "0.31.1"
  SOLANA_VERSION: "4.1.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: anchor-${{ env.ANCHOR_VERSION }}-solana-${{ env.SOLANA_VERSION }}
          cache-bin: false

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check repository hygiene
        run: yarn check:hygiene

      - name: Check production helper shape
        run: yarn check:code-shape

      - name: Check actionable Clippy warnings
        run: yarn check:clippy

      - name: Test Dusk program
        run: cargo test -p dusk

      - name: Check Dusk production features
        run: cargo check -p dusk --lib --features production

      - name: Test Dusk production features
        run: cargo test -p dusk --lib --features production

      - name: Check EMA settlement economic invariants
        run: cargo test -p dusk --lib --features benchmark ema_admitted_settlement_preserves_reference_and_resource_delta

      - name: Test leverage delegate
        run: cargo test -p leverage_delegate

      - name: Test mock-token faucet
        run: cargo test -p faucet

      - name: Typecheck test harness
        run: yarn typecheck

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache Anchor CLI
        id: anchor-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.ANCHOR_VERSION }}

      - name: Install Anchor CLI
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked

      - name: Verify Anchor CLI version
        run: test "$(anchor --version)" = "anchor-cli $ANCHOR_VERSION"

      - name: Build LiteSVM artifacts
        run: yarn build:litesvm

      - name: Check clean build identity
        run: |
          yarn check:build-identity
          git diff --exit-code -- Anchor.toml programs

      - name: Check Dusk SDK package
        run: npm run check:dusk-sdk

      - name: Test LP metadata upload client
        run: yarn test:lp-metadata

      - name: Upload LiteSVM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litesvm-sbf
          retention-days: 1
          if-no-files-found: error
          path: |
            target/deploy/dusk.so
            target/deploy/leverage_delegate.so
            target/deploy/faucet.so
            target/deploy/referral_transfer_hook.so
            target/deploy/token_metadata_fixture.so
            target/deploy/operator_adapter.so
            target/idl/dusk.json
            target/idl/leverage_delegate.json
            target/idl/faucet.json

  litesvm:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Require ARM64 interpreter runner
        run: test "$(uname -m)" = "arm64"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Download LiteSVM artifacts
        uses: actions/download-artifact@v4
        with:
          name: litesvm-sbf
          path: target

      - name: Test LiteSVM smoke suite
        run: yarn test-litesvm:no-build --forbid-pending
        env:
          DUSK_REQUIRE_COMPLETE_CU_BASELINE: "1"
