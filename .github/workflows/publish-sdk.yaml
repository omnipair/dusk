name: publish-sdk

# Publishes @omnipair/dusk-sdk once the version on main is deployed.
#
# A merge to main that touches the package publishes
# the version in packages/dusk-sdk/package.json when that version is not on npm
# yet and every IDL the package ships matches the IDL account on the cluster
# the version describes:
#
#   <x.y.z>-next.<n>     devnet deployment    dist-tag next
#   <x.y.z>-devnet.<n>   devnet deployment    dist-tag devnet
#   <x.y.z>              mainnet deployment   dist-tag latest
#
# A merge that keeps a published version publishes nothing. A merge whose IDLs
# do not match the cluster yet publishes nothing and leaves a warning; once the
# deployment is live, re-running that run publishes it. The check covers the
# interface for devnet. Stable releases additionally match both deployed binaries
# and authorities against a successfully tested release bundle for this commit.
#
# A pull request that touches the package checks its version and build without
# requiring a deployment. Deployment matching runs before publishing from main
# or a release tag. A merge can wait for deployment and be re-run afterwards.
#
# A `dusk-sdk-v<version>` tag on a deployed main commit also publishes it, and
# fails instead of warning when the IDLs differ. A manual run takes an existing
# tag: it publishes versions tagged on commits that predate this workflow, or
# checks a tag without publishing (dry_run). A dry run also logs in to npm the
# way a real run does, so a broken trusted publisher fails the dry run instead
# of the release. Merges and tag pushes attest their own commit in the npm
# provenance; a manual run attests the commit the workflow ran from.
#
# Authentication is npm trusted publishing (OIDC) for this file and the `npm`
# environment. An NPM_TOKEN secret, when present, is the fallback. npm does not
# check which branch a run comes from, so only runs from main or a dusk-sdk-v*
# tag can use the environment; the publish job of a run from another branch is
# rejected before it starts. A tag push runs the workflow file of the tagged
# commit, so only organization owners can create, move or delete dusk-sdk-v*
# tags (ruleset protect-sdk-release-tags).

on:
  push:
    branches:
      - main
    tags:
      - "dusk-sdk-v*"
    # GitHub applies path filters to branch pushes only; every tag push runs.
    paths:
      - "packages/dusk-sdk/**"
      - ".github/workflows/publish-sdk.yaml"
  pull_request:
    paths:
      - "packages/dusk-sdk/**"
      - ".github/workflows/publish-sdk.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing dusk-sdk-v<version> tag"
        required: true
        type: string
      dry_run:
        description: "Check the build and the npm login without publishing"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  PACKAGE_NAME: "@omnipair/dusk-sdk"
  PACKAGE_DIR: packages/dusk-sdk
  TAG_PREFIX: dusk-sdk-v
  NPM_VERSION: "11.21.1"

jobs:
  build:
    name: Build and match the deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Empty for a merge to main or a pull request, which take their version
      # from the manifest.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || '' }}
      MERGE: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    outputs:
      version: ${{ steps.channel.outputs.version }}
      dist_tag: ${{ steps.channel.outputs.dist_tag }}
      published: ${{ steps.registry.outputs.published }}
      deployed: ${{ steps.idl.outputs.deployed == 'true' && (steps.channel.outputs.dist_tag != 'latest' || steps.code.outputs.verified == 'true') }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG && format('refs/tags/{0}', env.TAG) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and channel
        id: channel
        run: |
          if [ -n "$TAG" ]; then
            case "$TAG" in
              "$TAG_PREFIX"*) VERSION="${TAG#"$TAG_PREFIX"}" ;;
              *)
                echo "::error::$TAG is not a ${TAG_PREFIX}<version> tag."
                exit 1
                ;;
            esac
          else
            VERSION="$(node -p 'require(process.argv[1]).version' "./$PACKAGE_DIR/package.json")"
          fi
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$VERSION" =~ $SEMVER ]]; then
            echo "::error::$VERSION is not a semver version."
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
          else
            DIST_TAG=latest
          fi
          case "$DIST_TAG" in
            latest) CLUSTER=mainnet-beta ;;
            next | devnet) CLUSTER=devnet ;;
            *)
              echo "::error::Prerelease '$DIST_TAG' has no npm channel. Devnet versions end in -next.<n> or -devnet.<n>; mainnet versions have no prerelease."
              exit 1
              ;;
          esac
          {
            echo "version=$VERSION"
            echo "dist_tag=$DIST_TAG"
            echo "cluster=$CLUSTER"
          } >> "$GITHUB_OUTPUT"

      - name: Check the source
        env:
          VERSION: ${{ steps.channel.outputs.version }}
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
          CLUSTER: ${{ steps.channel.outputs.cluster }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMIT="$(git rev-parse HEAD)"
          # A pull request is checked before it reaches main.
          if [ "$PULL_REQUEST" != "true" ]; then
            git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main; then
              if [ -n "$TAG" ]; then
                echo "::error::$TAG points at $COMMIT, which is not on main. Tag the deployed commit once it has merged."
              else
                echo "::error::$COMMIT is no longer on main."
              fi
              exit 1
            fi
          fi
          MANIFEST="$PACKAGE_DIR/package.json"
          ID="$(node -p 'const m = require(process.argv[1]); `${m.name}@${m.version}`' "./$MANIFEST")"
          if [ "$ID" != "$PACKAGE_NAME@$VERSION" ]; then
            echo "::error::${TAG:-This run} expects $PACKAGE_NAME@$VERSION, but $MANIFEST at $COMMIT declares $ID."
            exit 1
          fi
          SOURCE="merge to main"
          if [ -n "$TAG" ]; then
            SOURCE="\`$TAG\`"
          elif [ "$PULL_REQUEST" = "true" ]; then
            SOURCE="pull request #$PR_NUMBER"
          fi
          {
            echo "### $PACKAGE_NAME@$VERSION"
            echo ""
            echo "| Source | Commit | Cluster | dist-tag |"
            echo "| --- | --- | --- | --- |"
            echo "| $SOURCE | \`$COMMIT\` | $CLUSTER | \`$DIST_TAG\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the registry
        id: registry
        env:
          VERSION: ${{ steps.channel.outputs.version }}
          CLUSTER: ${{ steps.channel.outputs.cluster }}
        run: |
          # A merge or pull request that keeps a published version has nothing
          # to build.
          BUILD=true
          if OUTPUT="$(npm view "$PACKAGE_NAME@$VERSION" version 2>&1)"; then
            PUBLISHED=true
            STATUS="$PACKAGE_NAME@$VERSION is already on npm"
            NEXT="nothing to publish."
            if [ "$MERGE" = "true" ]; then
              BUILD=false
              NEXT="this merge publishes nothing. A change to the package needs a new version in $PACKAGE_DIR/package.json."
            elif [ "$PULL_REQUEST" = "true" ]; then
              BUILD=false
              NEXT="merging this pull request publishes nothing. A change to the package needs a new version in $PACKAGE_DIR/package.json."
            fi
          elif grep -q E404 <<< "$OUTPUT"; then
            PUBLISHED=false
            STATUS="Not on npm yet"
            NEXT="it publishes if every IDL it ships matches $CLUSTER."
            if [ "$PULL_REQUEST" = "true" ]; then
              NEXT="its merge publishes it if every IDL it ships matches $CLUSTER; deployment is not required for the pull request check."
            fi
          else
            echo "$OUTPUT"
            echo "::error::Could not read $PACKAGE_NAME@$VERSION from the npm registry."
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            NEXT="dry run, so the publish job only tests the npm login."
          fi
          {
            echo "published=$PUBLISHED"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$STATUS; $NEXT"
          echo "$STATUS; $NEXT" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.registry.outputs.build == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install JavaScript dependencies
        if: steps.registry.outputs.build == 'true'
        run: yarn install --frozen-lockfile

      # The package's build script first copies an Anchor build from target/
      # into src/. A release ships the committed src/, which CI checks against
      # a clean Anchor build. Publishing also checks against the cluster.
      - name: Build from the committed interface
        if: steps.registry.outputs.build == 'true'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          rm -rf dist
          npx --no-install tsc

      - name: Match the deployed IDLs
        id: idl
        if: steps.registry.outputs.build == 'true' && github.event_name != 'pull_request'
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          CLUSTER: ${{ steps.channel.outputs.cluster }}
          RPC_URL: ${{ steps.channel.outputs.cluster == 'mainnet-beta' && (secrets.MAINNET_RPC_URL || 'https://api.mainnet-beta.solana.com') || (secrets.DEVNET_RPC_URL || 'https://api.devnet.solana.com') }}
        run: |
          node <<'NODE'
          const { appendFileSync, readdirSync, readFileSync } = require("fs");
          const { createHash } = require("crypto");
          const { inflateSync } = require("zlib");
          const { Connection, PublicKey } = require("@solana/web3.js");

          // Anchor IDL account: 8-byte discriminator, 32-byte authority, u32
          // length, then that many bytes of zlib-compressed IDL JSON.
          const IDL_LENGTH_OFFSET = 40;
          const IDL_DATA_OFFSET = 44;
          const ATTEMPTS = 5;

          const canonical = (value) =>
            Array.isArray(value)
              ? value.map(canonical)
              : value && typeof value === "object"
                ? Object.fromEntries(
                    Object.keys(value)
                      .sort()
                      .map((key) => [key, canonical(value[key])])
                  )
                : value;
          const canonicalJson = (value) => JSON.stringify(canonical(value));
          const sha256 = (text) => createHash("sha256").update(text).digest("hex");

          async function getAccountInfo(connection, address) {
            for (let attempt = 1; ; attempt++) {
              try {
                return await connection.getAccountInfo(address);
              } catch (error) {
                if (attempt === ATTEMPTS) throw error;
                await new Promise((resolve) => setTimeout(resolve, 5_000 * attempt));
              }
            }
          }

          (async () => {
            const { CLUSTER, RPC_URL, MERGE, GITHUB_OUTPUT, GITHUB_STEP_SUMMARY } = process.env;
            // A merge can wait for deployment; a release tag must match now.
            const merge = MERGE === "true";
            const level = merge ? "warning" : "error";
            const connection = new Connection(RPC_URL, "confirmed");
            const files = readdirSync("src").filter((name) => /^idl_.+\.json$/.test(name)).sort();
            if (files.length === 0) {
              console.log("::error::src/ holds no idl_*.json to check.");
              process.exit(1);
            }
            const rows = [];
            let allMatch = true;

            for (const file of files) {
              const shipped = JSON.parse(readFileSync(`src/${file}`, "utf8"));
              const programId = new PublicKey(shipped.address);
              const [base] = PublicKey.findProgramAddressSync([], programId);
              const idlAddress = await PublicKey.createWithSeed(base, "anchor:idl", programId);
              const account = await getAccountInfo(connection, idlAddress);
              const shippedHash = sha256(canonicalJson(shipped));
              let verdict = "match";
              let deployedHash = "none";

              if (!account) {
                verdict = "no IDL account";
                console.log(
                  `::${level}::${file}: program ${programId.toBase58()} has no Anchor IDL account on ${CLUSTER} (${idlAddress.toBase58()}).`
                );
              } else {
                const length = account.data.readUInt32LE(IDL_LENGTH_OFFSET);
                const deployed = JSON.parse(
                  inflateSync(account.data.subarray(IDL_DATA_OFFSET, IDL_DATA_OFFSET + length)).toString("utf8")
                );
                deployedHash = sha256(canonicalJson(deployed));
                if (deployedHash !== shippedHash) {
                  verdict = "differs";
                  const sections = [...new Set([...Object.keys(shipped), ...Object.keys(deployed)])].filter(
                    (key) => canonicalJson(shipped[key]) !== canonicalJson(deployed[key])
                  );
                  const hint =
                    merge
                      ? ""
                      : " Upload the IDL of the deployed build with scripts/v2/upload_idl.sh, or tag the commit that was deployed.";
                  console.log(
                    `::${level}::${file} differs from the ${CLUSTER} IDL of ${programId.toBase58()} in: ${sections.join(", ")}.${hint}`
                  );
                }
              }

              if (verdict !== "match") allMatch = false;
              console.log(`${file} ${programId.toBase58()} ${CLUSTER}: ${verdict} (shipped ${shippedHash}, deployed ${deployedHash})`);
              rows.push(
                `| \`${file}\` | \`${programId.toBase58()}\` | \`${idlAddress.toBase58()}\` | \`${shippedHash.slice(0, 12)}\` | \`${deployedHash.slice(0, 12)}\` | ${verdict} |`
              );
            }

            const summary = [
              `Canonical IDL SHA-256 against ${CLUSTER}:`,
              "",
              "| IDL | Program | IDL account | Shipped | Deployed | Result |",
              "| --- | --- | --- | --- | --- | --- |",
              ...rows,
              "",
            ];
            if (!allMatch && merge) {
              const message = `This merge does not match the ${CLUSTER} deployment yet, so it publishes nothing. Once its programs and IDLs are live, re-run this run to publish it.`;
              console.log(`::${level}::${message}`);
              summary.push(message, "");
            }
            if (GITHUB_STEP_SUMMARY) appendFileSync(GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
            if (GITHUB_OUTPUT) appendFileSync(GITHUB_OUTPUT, `deployed=${allMatch}\n`);
            if (!allMatch && !merge) process.exit(1);
          })().catch((error) => {
            console.log(`::error::${String(error && error.message).replace(/https?:\/\/\S+/g, "<rpc-url>")}`);
            process.exit(1);
          });
          NODE

      - name: Locate tested production release bundle
        id: release
        if: steps.idl.outputs.deployed == 'true' && steps.channel.outputs.dist_tag == 'latest'
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'release-build.yaml', head_sha: commit,
              status: 'completed', event: 'push', per_page: 100,
            });
            const run = data.workflow_runs.find(run => run.head_sha === commit && run.head_branch === 'main' && run.conclusion === 'success');
            if (!run) throw new Error('No successful release build and exact-binary smoke test for this main commit. Finish release-build, deploy its bundle, then rerun publishing.');
            core.setOutput('run_id', String(run.id));
            core.setOutput('commit', commit);

      - name: Download tested production release bundle
        if: steps.idl.outputs.deployed == 'true' && steps.channel.outputs.dist_tag == 'latest'
        uses: actions/download-artifact@v4
        with:
          name: dusk-mainnet-release-${{ steps.release.outputs.commit }}
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
          path: target/mainnet-release

      - name: Match mainnet bytecode, IDLs and authorities to the tested source
        id: code
        if: steps.idl.outputs.deployed == 'true' && steps.channel.outputs.dist_tag == 'latest'
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
        run: |
          node scripts/release/verify.mjs target/mainnet-release "$(git rev-parse HEAD)" > "$RUNNER_TEMP/mainnet-verification.json"
          cat "$RUNNER_TEMP/mainnet-verification.json" >> "$GITHUB_STEP_SUMMARY"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      # A pull request stops after the checks.
      - name: Pack
        id: pack
        if: steps.idl.outputs.deployed == 'true' && (steps.channel.outputs.dist_tag != 'latest' || steps.code.outputs.verified == 'true') && github.event_name != 'pull_request'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          DESTINATION="$RUNNER_TEMP/package"
          mkdir -p "$DESTINATION"
          TARBALL="$(npm pack --ignore-scripts --pack-destination "$DESTINATION" | tail -n 1)"
          test -f "$DESTINATION/$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload tarball
        if: steps.idl.outputs.deployed == 'true' && (steps.channel.outputs.dist_tag != 'latest' || steps.code.outputs.verified == 'true') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dusk-sdk-tarball
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    # A pull request never publishes. A dry run comes here even for a version
    # already on npm, to test the login.
    if: (github.event_name != 'pull_request' && needs.build.outputs.published == 'false' && needs.build.outputs.deployed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    # Two runs for one version (a merge and a tag, or a re-run) wait for each
    # other instead of racing to publish it.
    concurrency:
      group: publish-sdk-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Install npm
        run: npm install --global "npm@$NPM_VERSION"

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: dusk-sdk-tarball
          path: package

      - name: Publish
        env:
          # The leading ./ keeps npm from reading package/<file> as a GitHub repo.
          TARBALL: ./package/${{ needs.build.outputs.tarball }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ID="$(tar -xOzf "$TARBALL" package/package.json | node -p 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); `${m.name}@${m.version}`')"
          if [ "$ID" != "$PACKAGE_NAME@$VERSION" ]; then
            echo "::error::$TARBALL holds $ID, expected $PACKAGE_NAME@$VERSION."
            exit 1
          fi
          # Another run for this version may have published it while this one waited.
          if [ "$DRY_RUN" != "true" ] && npm view "$PACKAGE_NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::$PACKAGE_NAME@$VERSION is already on npm; nothing to publish."
            echo "\`$PACKAGE_NAME@$VERSION\` was already on npm; nothing was published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          LOGS="$RUNNER_TEMP/npm-logs"
          ARGS=(publish "$TARBALL" --tag "$DIST_TAG" --access public --provenance --logs-dir "$LOGS")
          if [ "$DRY_RUN" = "true" ]; then
            # --force skips npm's refusal of a version already on npm, so a dry
            # run of a published tag still logs in. A dry run uploads nothing.
            ARGS+=(--dry-run --force)
          fi
          STATUS=0
          npm "${ARGS[@]}" || STATUS=$?
          # npm logs the trusted-publishing exchange, and why it failed, only in
          # its debug log.
          OIDC="$(cat "$LOGS"/*.log 2> /dev/null | grep oidc | sed -E 's/^[0-9]+ //' || true)"
          echo "::group::Trusted publishing"
          echo "${OIDC:-npm logged no trusted-publishing exchange.}"
          echo "::endgroup::"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::npm refused the publish. Check the trusted publisher for omnipair/dusk, publish-sdk.yaml and the npm environment, or the NPM_TOKEN fallback."
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ]; then
            echo "Published [\`$PACKAGE_NAME@$VERSION\`](https://www.npmjs.com/package/$PACKAGE_NAME/v/$VERSION) under \`$DIST_TAG\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A dry run succeeds without credentials, so check the login here.
          if grep -q "oidc Successfully retrieved and set token" <<< "$OIDC"; then
            RESULT="npm accepted the trusted-publishing login."
          elif [ -n "$NODE_AUTH_TOKEN" ] && WHO="$(npm whoami 2> /dev/null)"; then
            RESULT="Trusted publishing failed; a real run would publish with NPM_TOKEN as $WHO."
            echo "::warning::$RESULT"
          else
            echo "::error::npm refused the trusted-publishing login and no working NPM_TOKEN is set. Check the trusted publisher for omnipair/dusk, publish-sdk.yaml and the npm environment."
            exit 1
          fi
          echo "Dry run: $RESULT Nothing was published." >> "$GITHUB_STEP_SUMMARY"
