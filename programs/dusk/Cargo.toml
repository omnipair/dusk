[package]
name = "dusk"
version = "2.0.0"
description = "Dusk market architecture program for Omnipair V2"
edition = "2021"
resolver = "2"

[lib]
crate-type = ["cdylib", "lib"]
name = "dusk"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
cpi-no-ix = ["cpi", "no-log-ix-name"]
no-spl-memo = []
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
production = []
development = []
# Logs the hLP reserve-identity drift instead of only rejecting on it.
#
# The identity fails about a third of devnet swaps and the failure has resisted
# every off-chain reproduction: the deployed binary, the state captured at a
# failing instant, and every clock offset across two failure periods all pass
# in LiteSVM. Reading the actual drift is the remaining way to learn anything,
# and that means a build that prints it.
#
# Never enable this for a real deployment: it turns a silent bound into a log
# line on the hot path and says nothing about whether the bound is right.
debug-hlp-drift = []
# Off-chain-only access to deterministic native state transitions used by
# historical replay and economic benchmarking. Enabling it also removes the
# program entrypoint from the consumer binary.
benchmark = ["no-entrypoint"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed", "event-cpi", "derive"] }
anchor-spl = { version = "0.31.1", features = ["metadata"] }
# Code generated for `anchor-debug` refers to this crate directly.
solana-program = "2"
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "6.0.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "0.9.0"
spl-tlv-account-resolution = "0.9.0"
spl-math = { version = "0.3.0", features = ["no-entrypoint"] }
solana-security-txt = "1.1.1"
num-traits = "0.2.19"
uint = "0.9.1"
bytemuck = { version = "1.4.0", features = ["derive", "min_const_generics"] }
arrayref = { version = "0.3.6" }
bincode = "1.3"

[dev-dependencies]
num-bigint = "0.4"
quickcheck = "0.9"
proptest = "1.0"
rand = "0.8.5"
